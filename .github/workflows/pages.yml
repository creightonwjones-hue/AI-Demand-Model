name: Deploy data explorer to GitHub Pages

# Checks that the committed data/build/*.json matches a rebuild from committed inputs (no data is fetched here),
# then builds the explorer from it and publishes dist/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Rebuild data/build from the committed inputs and fail if it differs from the committed output
      # (manifest.json builtAt ignored).
      - run: npm run data:build
      - run: npm run data:check-fresh
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
